saving_dir: "paper_exp/obf_result/obf_uncer_multi/"
budget_ratio: 0.05            # load ranging from 0.95 to 1.05
budget_ratio_input: 0.1      # embedding ranging from 0.95 to 1.05
budget_ratio_forecast: 0.05   # forecast ranging from 0.98 to 1.02
max_iter: 100
no_train_sample: "all"   # how many samples are considered in the training
tol: 1e-3
train_config:
  no_data: 168
  M_DP: 1e3  # big-M when linearizing the dispatch problem kkt
  M_RD: 1e3  # big-M when linearizing the redispatch problem kkt
  alpha: 0.0
  verbose: false
  nn_dir: "paper_exp/obf_result/abf/"  # dir to the pre-trained ABF model